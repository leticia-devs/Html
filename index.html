<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oi Vida</title>

    <style>
        body{
            background-color: #f6d4e5;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 40px;
            overflow: hidden;
            height: 100vh;
        }

        h1{
            font-size: 50px;
            color: #d63384;
        }

        p{
            font-size: 30px;
            color: #6c1338ee;
        }

        button{
            font-size: 20px;
            padding: 10px 25px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #9f0d7d;
            font-weight: bold;
        }

        #botaoNao {
            position: relative;
            transition: 0.1s;
        }

        #gato {
            width: 300px;
            max-width: 80%;
            margin-top: 15px;
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <h1>Eu te amo minha vidaaaa !!!</h1>

    <p>Tenho um presente para você...</p>

    <p>Você quer saber o que é meu amor? ❤️</p>

    <button onclick="clicouSim()">Sim</button>

    <button id="botaoNao"
            onmouseover="fugir()"
            ontouchstart="fugir()">
        Não
    </button>

    <h2 id="resposta"></h2>

    <script>

        let proximoGif = null;

        // Pré-carrega o próximo GIF
        function carregarGif() {

            const img = new Image();

            img.src = "https://cataas.com/cat/gif?" + Date.now();

            img.onload = function() {
                proximoGif = img.src;
            };
        }

        // Já começa carregando um GIF
        carregarGif();


        function clicouSim() {

            let resposta = document.getElementById('resposta');

            if (proximoGif) {

                resposta.innerHTML = `
                    <p>Obaaaa! Te amo muito! ❤️🥰</p>

                    <p>
                        Esse é o seu presente:
                    </p>

                    <img id="gato" src="${proximoGif}" alt="Gatinho fofo">
                `;

                // Enquanto ela vê esse gato,
                // já carrega o próximo
                proximoGif = null;
                carregarGif();

            } else {

                resposta.innerHTML = `
                    <p>Obaaaa! Te amo muito! ❤️🥰</p>

                    <p>Seu presente está carregando... 🐱❤️</p>
                `;

                carregarGif();
            }
        }


        function fugir() {

            let botao = document.getElementById('botaoNao');

            let larguraMax = window.innerWidth - 120;
            let alturaMax = window.innerHeight - 120;

            let x = Math.random() * (larguraMax > 0 ? larguraMax : 50);
            let y = Math.random() * (alturaMax > 0 ? alturaMax : 50);

            botao.style.position = 'absolute';
            botao.style.left = x + 'px';
            botao.style.top = y + 'px';
        }

    </script>

</body>
</html>
