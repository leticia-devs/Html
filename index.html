<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oi Vida</title>
    <style>
        body{
            background-color: #f6d4e5;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 40px;
            overflow: hidden;
            height: 100vh;
        }
        h1{
            font-size: 50px;
            color: #d63384;
        }

        p{
            font-size: 30px;
            color: #6c1338ee;
        }
        button{
            font-size: 20px;
            padding: 10px 25px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #9f0d7d;
            font-weight: bold;
        }

        #botaoNao {
            position: relative;
            transition: 0.1s;
        }
    </style>
</head>
<body>
    <h1>Eu te amo minha vidaaaa !!!</h1>
    <p>Tenho um presente para você...</p>
    <p>você quer saber o que é meu amor? ❤️</p>
    
    <button onclick="clicouSim()">Sim</button>
    <button id="botaoNao" onmouseover="fugir()" ontouchstart="fugir()">Não</button>

    <h2 id="resposta"></h2>
    
    <script>
    function clicouSim() {

        document.getElementById('resposta').innerHTML = `
            <p>Oba! Te amo muito! ❤️🥰</p>
            <p>Para receber o seu presente... <a href="https://cataas.com/cat" target="_blank">clique aqui</a></p>
        `;
    }

    function fugir() {
        let botao = document.getElementById('botaoNao');
        let larguraMax = window.innerWidth - 120;
        let alturaMax = window.innerHeight - 120;
        let x = Math.random() * (larguraMax > 0 ? larguraMax : 50);
        let y = Math.random() * (alturaMax > 0 ? alturaMax : 50);
        botao.style.position = 'absolute';
        botao.style.left = x + 'px';
        botao.style.top = y + 'px';
    }
    </script>
</body>
</html>
